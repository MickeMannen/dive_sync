name: Build and attach release artifacts

# Manual-only (rework.md E12): you create a GitHub Release yourself first
# (draft or published), then run this with the platforms you want, picking
# the release's tag in the "Use workflow from" dropdown - not a branch. The
# workflow and code then come from that tag. Never triggers on a push -
# nothing here happens without you picking it from the Actions tab and
# choosing what to build. macOS always signs
# with the real Developer ID cert and notarizes (rework.md E3) since this is
# for something you're actually giving out, unlike desktop-build.yml's
# adhoc-signed PR/dispatch builds. Docker Hub is only touched when
# "push_docker" is checked, by calling docker-release.yml as a reusable job.
# The release tag sets the version everywhere: the desktop jobs write it into
# pyproject.toml on the runner (.github/scripts/set_version.py), and Docker
# gets it as APP_VERSION - no need to bump pyproject.toml by hand.

on:
  workflow_dispatch:
    inputs:
      build_macos:
        description: "Build and sign the macOS app"
        type: boolean
        default: true
      build_windows:
        description: "Build the Windows app"
        type: boolean
        default: true
      build_linux:
        description: "Build the Linux app"
        type: boolean
        default: true
      push_docker:
        description: "Also build and push the Docker image to Docker Hub"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Require a tag
        if: github.ref_type != 'tag'
        run: |
          echo "::error::Pick the release's tag (e.g. v0.2.1) in the 'Use workflow from' dropdown, not a branch."
          exit 1

  macos:
    needs: check
    if: ${{ inputs.build_macos }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip "briefcase==0.4.5"
      - name: Set the version from the release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python .github/scripts/set_version.py
      - run: briefcase build macOS app

      - name: Import Developer ID certificate
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -eu
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 1800 build.keychain
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain login.keychain
          security default-keychain -s build.keychain
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_KEYCHAIN_PASSWORD" build.keychain

      # notarytool needs the keychain's full path; the security commands
      # above find it by name.
      - name: Store notarization credentials
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -eu
          xcrun notarytool store-credentials "briefcase-macOS-$APPLE_TEAM_ID" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --keychain "$HOME/Library/Keychains/build.keychain-db"

      - name: Find the Developer ID signing identity
        run: |
          set -eu
          IDENTITY=$(security find-identity -v -p codesigning build.keychain \
            | grep '"Developer ID Application' | head -1 | sed -E 's/^[^"]*"([^"]*)".*$/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' identity found in the imported certificate."
            exit 1
          fi
          echo "Signing identity: $IDENTITY"
          echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Package (sign + notarize)
        run: briefcase package macOS app -i "$IDENTITY"

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" dist/*.dmg --clobber --repo "${{ github.repository }}"

  windows:
    needs: check
    if: ${{ inputs.build_windows }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip "briefcase==0.4.5"
      - name: Set the version from the release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python .github/scripts/set_version.py
      - run: briefcase build windows app
      - run: briefcase package windows app
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" dist/*.msi --clobber --repo "${{ github.repository }}"

  linux:
    needs: check
    if: ${{ inputs.build_linux }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y socat
      - run: python -m pip install -U pip "briefcase==0.4.5"
      - name: Set the version from the release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python .github/scripts/set_version.py
      - run: briefcase build linux system --target ubuntu:24.04
      - run: briefcase package linux system --target ubuntu:24.04 --adhoc-sign
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" dist/*.deb --clobber --repo "${{ github.repository }}"

  docker:
    needs: check
    if: ${{ inputs.push_docker }}
    uses: ./.github/workflows/docker-release.yml
    with:
      app_version: ${{ github.ref_name }}
    secrets: inherit
