name: Build and Push Docker Image

# Publishes to Docker Hub. Deliberately manual-only (rework.md E12, per the
# owner's explicit instruction 2026-09-22): a "release: published" trigger
# used to fire this automatically the moment a GitHub Release was created,
# which pushed a build before the owner had any chance to review or choose
# to do so - removed for exactly that reason (caught and cancelled mid-run
# on v0.2.0-alpha, confirmed nothing reached Docker Hub). Runs only via
# manual workflow_dispatch, or as a reusable job called from
# release-build.yml when "push_docker" is checked there.

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      app_version:
        description: "Version string to bake in (APP_VERSION build arg); falls back to the triggering release tag or ref name when omitted"
        type: string
        required: false

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME || secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_PASSWORD || secrets.DOCKERHUB_PASSWORD || secrets.DOCKER_HUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: mickemannen/dive_sync
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ inputs.app_version || github.event.release.tag_name || github.ref_name || 'unknown' }}

      - name: Update Docker Hub Description
        uses: peter-evans/dockerhub-description@v4
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME || secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_PASSWORD || secrets.DOCKERHUB_PASSWORD || secrets.DOCKER_HUB_TOKEN }}
          repository: mickemannen/dive_sync
          short-description: "Automated Dive Log Synchronization Engine between Garmin Connect and Divelogs.org"
          readme-filepath: ./DOCKERHUB.md
