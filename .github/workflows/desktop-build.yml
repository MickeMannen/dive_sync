name: Desktop app build (Briefcase)

# Build-only (rework.md E2): confirms the Qt Quick desktop app packages on
# macOS, Windows and Linux; a PR/dispatch run always adhoc-signs (fast, no
# Apple credentials needed). Real macOS signing + notarization (E3) is
# opt-in via workflow_dispatch's "sign" input, since it needs Apple Developer
# secrets and notarization can take several minutes - not something every PR
# should pay for. Does not attach anything to a GitHub Release yet (E12,
# still planned).

on:
  workflow_dispatch:
    inputs:
      sign:
        description: "macOS: sign with the real Developer ID cert and notarize (needs the Apple secrets below configured)"
        type: boolean
        default: false
  pull_request:
    paths:
      - "desktop/**"
      - "src/core/**"
      - "pyproject.toml"
      - ".github/workflows/desktop-build.yml"

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      SIGN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.sign == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip "briefcase==0.4.5"
      - run: briefcase build macOS app --test

      # -- E3: real signing + notarization, only when SIGN is true -------
      - name: Import Developer ID certificate
        if: env.SIGN == 'true'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -eu
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 1800 build.keychain
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain login.keychain
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_KEYCHAIN_PASSWORD" build.keychain

      - name: Store notarization credentials
        if: env.SIGN == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -eu
          xcrun notarytool store-credentials "briefcase-macOS-$APPLE_TEAM_ID" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --keychain build.keychain

      - name: Find the Developer ID signing identity
        if: env.SIGN == 'true'
        run: |
          set -eu
          IDENTITY=$(security find-identity -v -p codesigning build.keychain \
            | grep '"Developer ID Application' | head -1 | sed -E 's/^[^"]*"([^"]*)".*$/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' identity found in the imported certificate."
            exit 1
          fi
          echo "Signing identity: $IDENTITY"
          echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Package (real sign + notarize)
        if: env.SIGN == 'true'
        run: briefcase package macOS app -i "$IDENTITY"

      # -- Default path: adhoc-sign, no Apple credentials needed ----------
      - name: Package (adhoc sign)
        if: env.SIGN != 'true'
        run: briefcase package macOS app --adhoc-sign

      - uses: actions/upload-artifact@v4
        with:
          name: DiveSync-macOS
          path: dist/*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip "briefcase==0.4.5"
      - run: briefcase build windows app --test
      - run: briefcase package windows app
      - uses: actions/upload-artifact@v4
        with:
          name: DiveSync-windows
          path: dist/*.msi

  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # GitHub Actions expressions have no string-replace function, so a
        # colon-free "label" travels alongside "target" for the artifact
        # name (upload-artifact rejects ':' in a name) instead of deriving
        # one from target at usage time.
        include:
          - target: "ubuntu:24.04"
            label: "ubuntu-24.04"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Briefcase's "system" Linux format builds inside a per-distro Docker
      # container it manages itself; socat is what it uses to talk to that
      # container (docs: briefcase.beeware.org how-to/building/ci).
      - run: sudo apt-get update && sudo apt-get install -y socat
      - run: python -m pip install -U pip "briefcase==0.4.5"
      - run: briefcase build linux system --target ${{ matrix.target }} --test
      - run: briefcase package linux system --target ${{ matrix.target }} --adhoc-sign
      - uses: actions/upload-artifact@v4
        with:
          name: DiveSync-linux-${{ matrix.label }}
          path: dist/*.deb
