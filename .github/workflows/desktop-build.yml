name: Desktop app build (Briefcase)

# Build-only (rework.md E2): confirms the Qt Quick desktop app packages on
# macOS, Windows and Linux. Does not sign (E3, deferred - no Apple
# credentials yet) or attach anything to a GitHub Release (E12, still
# planned); artifacts are uploaded here for manual download/testing only.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "desktop/**"
      - "src/core/**"
      - "pyproject.toml"
      - ".github/workflows/desktop-build.yml"

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip briefcase
      - run: briefcase build macOS app --test
      - run: briefcase package macOS app --adhoc-sign
      - uses: actions/upload-artifact@v4
        with:
          name: DiveSync-macOS
          path: dist/*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip briefcase
      - run: briefcase build windows app --test
      - run: briefcase package windows app
      - uses: actions/upload-artifact@v4
        with:
          name: DiveSync-windows
          path: dist/*.msi

  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ["ubuntu:24.04"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Briefcase's "system" Linux format builds inside a per-distro Docker
      # container it manages itself; socat is what it uses to talk to that
      # container (docs: briefcase.beeware.org how-to/building/ci).
      - run: sudo apt-get update && sudo apt-get install -y socat
      - run: python -m pip install -U pip briefcase
      - run: briefcase build linux system --target ${{ matrix.target }} --test
      - run: briefcase package linux system --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: DiveSync-linux-${{ matrix.target }}
          path: dist/*.deb
